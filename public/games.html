*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#35190e 0%,var(--bg) 52%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#120d0df2;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.nav{max-width:1400px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.brand{font-size:25px;font-weight:900;color:var(--orange);white-space:nowrap}
.brand span{color:#fff}
nav{display:flex;gap:8px;flex-wrap:wrap}
button,.navlink{font:inherit;cursor:pointer;border:1px solid var(--border);background:#241814;color:var(--text);border-radius:10px;padding:10px 14px}

.hero:after{content:"🎃";position:absolute;right:35px;top:18px;font-size:84px;opacity:.18;transform:rotate(12deg)}

.status.error{color:#ffc1b9;border-color:#803c30}
.status.good{color:#baf2c0;border-color:#315e37}

#search{flex:1;min-width:200px}
.az{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px;position:sticky;top:74px;z-index:4;background:#120d0de6;padding:8px 0;backdrop-filter:blur(8px)}

h2{font-size:24px;margin:0}
#count{color:var(--muted);font-size:14px}
.letter{font-size:28px;font-weight:900;color:var(--orange);margin:28px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border);scroll-margin-top:130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:16px}
.game{min-width:0;background:var(--panel);border:1px solid var(--border);border-radius:15px;overflow:hidden;transition:transform .16s,border-color .16s;cursor:pointer}
.game:hover{transform:translateY(-4px);border-color:var(--orange)}

.panel{display:none;margin-top:20px;padding:20px;background:var(--panel);border:1px solid var(--border);border-radius:15px}

const WSET = new Set(WORDS);

function segment(s){
  const n = s.length, best = new Array(n+1).fill(Infinity), prev = new Array(n+1).fill(-1);
  best[0] = 0;
  for(let i=1;i<=n;i++){
    for(let j=Math.max(0,i-14);j<i;j++){
      if(best[j]===Infinity) continue;
      const w = s.slice(j,i);
      const known = WSET.has(w);
      const tiny = (i - j) <= 2;
      const cost = best[j] + (known ? (tiny ? 5 : 1) : (i - j) * 3 + 4 + (tiny ? 20 : 0));
      if(cost < best[i]){ best[i]=cost; prev[i]=j; }
    }
  }
  const out=[]; let i=n;
  while(i>0){ out.unshift(s.slice(prev[i],i)); i=prev[i]; }
  return out;
}

function prettify(id){
  let s = id.replace(/^cl/,"").replace(/\.html?$/i,"").replace(/\s*\(\d+\)\s*$/,"").replace(/[\uFFFD]/g,"e");
  s = s.replace(/x3m/ig," X3M ").replace(/[_\-]+/g," ").replace(/\s+/g," ").trim();
  if(!s) return id;
  const parts = s.split(" ").flatMap(p=>{
    // camelCase / digits split
    if(/[()]/.test(p)) return [p];
    let q = p.replace(/^(\d+v\d+)(?=[a-z])/i,"$1 ").replace(/([a-z])([A-Z])/g,"$1 $2").replace(/([A-Za-z]{3,})(\d)/g,"$1 $2").replace(/(\d)([A-Za-z]{3,})/g,"$1 $2");
    return q.split(" ").flatMap(t=>{
      if(/^\d+$/.test(t) || t.length<=3) return [t];
      if(t!==t.toLowerCase() && t!==t.toUpperCase()) return [t]; // mixed case already readable
      const seg = segment(t.toLowerCase());
      const unk = seg.filter(w=>!WSET.has(w));
      const tiny = unk.filter(w=>w.length<=2).length;
      return (unk.join("").length > t.length*0.5 || tiny>=1 && unk.length>=2) ? [t] : seg;
    });
  });
  return parts.map(w=>{
    if(/^(gba|nes|snes|gb|ds|dx|ex|td|rpg|io|hd|2d|3d|fnf|fnaf|gta|psx|n64|ps1|cod|pvz|btd|vs)$/i.test(w)) return w.length<=3 && w!=="vs" ? w.toUpperCase() : (w==="vs"?"vs":w.toUpperCase());
    return w.charAt(0).toUpperCase()+w.slice(1);
  }).join(" ");
}

function isHttpUrl(v) { try { const u = new URL(v); return u.protocol === "https:" || u.protocol === "http:"; } catch { return false; } }

function gameUrl(id) {
  const file = /\.[A-Za-z0-9]+$/.test(id) && id.lastIndexOf(".") > 0 ? id : id + ".html";
  return GAME_BASE + encodeURIComponent(file);
}

async function fetchJson(url, ms = 15000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function fetchText(url, ms = 20000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, { signal: c.signal, cache: "no-store" }); if (!r.ok) throw new Error("HTTP " + r.status); return await r.text(); }
  finally { clearTimeout(t); }
}

function coverUrlFor(item, src) {
  let raw = item.cover ?? item.image ?? item.thumbnail ?? item.icon ?? "";
  const id = item.id ?? item.gameId ?? item.slug;
  if (typeof raw === "string" && raw.trim()) {
    raw = raw.trim().replaceAll("{COVER_URL}", src.covers).replaceAll("{HTML_URL}", src.html);
    if (isHttpUrl(raw)) return raw;
    if (raw.startsWith("//")) return "https:" + raw;
    if (raw.startsWith("/")) return src.html + raw;
    return src.covers + "/" + raw.replace(/^\.?\//, "");
  }
  return id != null ? src.covers + "/" + encodeURIComponent(String(id)) + ".png" : "";
}

const STOP = /\b(unblocked|online|the|game|games|edition|version|ver|v\d+|free|html5|hd|remastered|redux)\b/g;

function simplify(name) {
  return String(name).toLowerCase().replace(/\(.*?\)/g, " ").replace(/&/g, "and").replace(STOP, " ").replace(/[^a-z0-9]/g, "").replace(/fnaf/g, "fivenightsatfreddys");
}
function digitsOf(s) { return (s.match(/\d+/g) || []).join(","); }

function initStaticCovers() {
  const exact = new Map(), simple = new Map();
  for (const [name, file] of Object.entries(STATIC_COVERS)) {
    const url = STATIC_COVER_BASE + file, k = norm(name), sk = simplify(name);
    if (!exact.has(k)) exact.set(k, url);
    if (sk && !simple.has(sk)) simple.set(sk, url);
  }
  coverMap = exact; coverSimple = simple; coverIndex = [...simple.entries()];
}

async function loadCovers() {
  const exact = new Map(coverMap); const simple = new Map(coverSimple);
  // merge BOTH catalogs so a cover missing from one can come from the other
  for (const src of COVER_SOURCES) {
    try {
      const data = await fetchJson(src.zones + "?haunthub=" + Date.now());
      const list = Array.isArray(data) ? data : (data.zones || data.games || data.items || []);
      list.forEach(item => {
        const name = item && (item.name ?? item.title);
        if (!name) return;
        const cover = coverUrlFor(item, src);
        if (!cover) return;
        const k = norm(name), sk = simplify(name);
        if (!exact.has(k)) exact.set(k, cover);
        if (sk && !simple.has(sk)) simple.set(sk, cover);
      });
    } catch (e) { /* skip this source */ }
  }
  coverMap = exact;
  coverIndex = [...simple.entries()];
  coverSimple = simple;
}
let coverSimple = new Map();

const SUFFIXES = /(good|cool|alt|debug|hack|hacked|modmenu|fixed|offline|encrypted|goof|real)$/;
function stripSuffix(k) { let r = k; for (let i = 0; i < 2; i++) { const t = r.replace(SUFFIXES, ""); if (t.length >= 5) r = t; } return r; }

function lev(a, b) {
  const m = a.length, n = b.length; let prev = Array.from({ length: n + 1 }, (_, j) => j);
  for (let i = 1; i <= m; i++) {
    const cur = [i];
    for (let j = 1; j <= n; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[n];
}
function fuzzyCover(key) {
  if (key.length < 7) return "";
  let best = "", bestScore = 0;
  for (const [ck, url] of coverIndex) {
    if (ck.length < 7 || Math.abs(ck.length - key.length) > 3) continue;
    if (ck.slice(0, 3) !== key.slice(0, 3)) continue;
    if (digitsOf(ck) !== digitsOf(key)) continue;
    if (ck.replace(/[ivx]/g, "") === key.replace(/[ivx]/g, "")) continue;       // II vs VII style differences
    const score = 1 - lev(ck, key) / Math.max(ck.length, key.length);
    if (score >= 0.88 && score > bestScore) { best = url; bestScore = score; }
  }
  return best;
}

function coverFor(game) {
  const idStr = game.id.replace(/^cl/i, "");
  const k = norm(game.name), idk = norm(idStr);
  if (coverMap.has(k)) return coverMap.get(k);
  if (coverMap.has(idk)) return coverMap.get(idk);
  const keys = [...new Set([simplify(game.name), simplify(idStr)])].filter(Boolean);
  const variants = [...new Set(keys.flatMap(x => [x, stripSuffix(x)]))];
  for (const v of variants) if (coverSimple.has(v)) return coverSimple.get(v);
  // careful containment match: nearly the same length and same numbers (so "Cookie Clicker 2" never gets "Cookie Clicker")
  for (const key of variants) {
    if (key.length < 6) continue;
    let best = null, bestRatio = 0;
    for (const [ck, url] of coverIndex) {
      if (ck.length < 6) continue;
      const [short, long] = key.length <= ck.length ? [key, ck] : [ck, key];
      if (!long.includes(short)) continue;
      const ratio = short.length / long.length;
      if (ratio >= 0.85 && digitsOf(key) === digitsOf(ck) && ratio > bestRatio) { best = url; bestRatio = ratio; }
    }
    if (best) return best;
  }
  for (const v of variants) { const f = fuzzyCover(v); if (f) return f; }             // typos like "Achievmentunlocked"
  for (const v of variants) {
    for (const [prefix, name] of PREFIX_ALIASES) {
      if (v.startsWith(prefix)) { const u = coverSimple.get(simplify(name)); if (u) return u; }
    }
  }
  return "";
}

async function loadGames(showMessage = false) {
  const btn = $("refreshBtn"); btn.disabled = true;
  if (showMessage) setStatus("Refreshing the UGS game list…");
  try {
    const txt = await fetchText(LIST_URL + "?t=" + Date.now());
    const m = txt.match(/let\s+files\s*=\s*(\[[\s\S]*?\]);/);
    if (!m) throw new Error("game list not found");
    const ids = JSON.parse(m[1]);
    const seen = new Set(), out = [];
    ids.forEach(id => {
      if (!id || !/^cl/i.test(id)) return;          // skip non-game entries like esm / npm / skypack
      const name = prettify(id);
      const key = norm(name);
      if (!key || seen.has(key)) return;
      seen.add(key);
      out.push({ id, name, url: gameUrl(id), cover: "", category: "UGS", origin: "catalog" });
    });
    ugsGames = out;
    setStatus("Loaded " + out.length + " games from the UGS collection.", "good");
    initStaticCovers();
    ugsGames.forEach(g => g.cover = coverFor(g));
    renderGames();
    // covers load in the background and are applied when ready
    loadCovers().then(() => { ugsGames.forEach(g => g.cover = coverFor(g)); renderGames(); });
  } catch (e) {
    ugsGames = []; renderGames();
    setStatus("The UGS game list could not load (" + (e.message || "network error") + "). Press Refresh to try again.", "error");
  }
  btn.disabled = false;
}

function allGames() { return ugsGames; }
const cmp = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: "base" });
const letterOf = n => { const c = (n.trim()[0] || "#").toUpperCase(); return /[A-Z]/.test(c) ? c : "#"; };

/* ---- automatic cover search (Wikipedia) for games the catalogs don't have ---- */
const WIKI_KEY = "haunthub_wiki_covers_v2";
let wikiCache = {};
try { wikiCache = JSON.parse(localStorage.getItem(WIKI_KEY) || "{}") || {}; } catch { wikiCache = {}; }
function saveWiki() { try { localStorage.setItem(WIKI_KEY, JSON.stringify(wikiCache)); } catch {} }
const wikiQueue = []; let wikiActive = 0;

async function wikiOnly(game) {
  const gk = simplify(game.name);
  if (!gk || gk.length < 4) return "";
  const url = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=4" +
    "&gsrsearch=" + encodeURIComponent(game.name + " video game") + "&prop=pageimages&piprop=thumbnail&pithumbsize=400";
  const j = await fetchJson(url, 10000);
  const pages = Object.values((j.query && j.query.pages) || {}).sort((a, b) => a.index - b.index);
  for (const pg of pages) {
    if (!pg.thumbnail || !pg.thumbnail.source) continue;
    const tk = simplify(String(pg.title).replace(/\(.*?\)/g, ""));
    if (!tk) continue;
    if (digitsOf(tk) !== digitsOf(gk)) continue;
    const [sh, lg] = tk.length <= gk.length ? [tk, gk] : [gk, tk];
    if (tk === gk || (sh.length >= 5 && lg.includes(sh) && sh.length / lg.length >= 0.75)) return pg.thumbnail.source;
  }
  return "";
}

function titleMatches(title, gk) {
  const tk = simplify(String(title).split(/\s[-–:|]\s|:/)[0].replace(/\(.*?\)/g, ""));
  if (!tk || digitsOf(tk) !== digitsOf(gk)) return false;
  const [sh, lg] = tk.length <= gk.length ? [tk, gk] : [gk, tk];
  return tk === gk || (sh.length >= 5 && lg.includes(sh) && sh.length / lg.length >= 0.75);
}

/* second source: Apple's store search (has cover art for a huge number of games) */
async function itunesFind(game) {
  const gk = simplify(game.name);
  if (!gk || gk.length < 4) return "";
  const j = await fetchJson("https://itunes.apple.com/search?media=software&limit=6&term=" + encodeURIComponent(game.name), 10000);
  for (const r of (j.results || [])) {
    if (r.artworkUrl512 && titleMatches(r.trackName, gk)) return r.artworkUrl512;
  }
  return "";
}

async function wikiFind(game) {
  let url = "";
  try { url = await wikiOnly(game); } catch (e) { /* try the next source */ }
  if (url) return url;
  return await itunesFind(game);   // throws on network failure so the result isn't cached
}

function setCoverImage(el, url) {
  if (el.querySelector("img")) return;
  const img = document.createElement("img");
  img.src = url; img.alt = ""; img.loading = "lazy";
  img.style.cssText = "position:absolute;inset:0";
  img.onload = () => { el.style.position = "relative"; el.firstChild && el.firstChild.nodeType === 3 && (el.firstChild.textContent = ""); };
  img.onerror = () => img.remove();
  el.style.position = "relative";
  el.appendChild(img);
}

function wikiPump() {
  while (wikiActive < 3 && wikiQueue.length) {
    const el = wikiQueue.shift(); const game = el._game;
    wikiActive++;
    (async () => {
      let url = wikiCache[game.name];
      if (url === undefined) {
        try { url = await wikiFind(game); wikiCache[game.name] = url; saveWiki(); }
        catch { url = ""; /* network hiccup: don't cache, will retry next visit */ }
      }
      if (url) setCoverImage(el, url);
    })().finally(() => { wikiActive--; wikiPump(); });
  }
}
const wikiObserver = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { wikiObserver.unobserve(e.target); wikiQueue.push(e.target); wikiPump(); } });
}, { rootMargin: "300px" });

function watchCover(el, game) {
  el._game = game;
  const cached = wikiCache[game.name];
  if (cached) setCoverImage(el, cached);
  else if (cached === undefined) wikiObserver.observe(el);
}

function tileBg(name) { let h = 0; for (const c of name) h = (h * 31 + c.charCodeAt(0)) % 40; return "linear-gradient(135deg,hsl(" + (10 + h) + ",70%,32%),hsl(" + (h) + ",60%,14%))"; }
function initialsOf(name) { const w = name.split(" ").filter(x => /[A-Za-z0-9]/.test(x)); return ((w[0] || "?")[0] + (w[1] ? w[1][0] : "")).toUpperCase(); }

function makeCard(game) {
  const card = document.createElement("article");
  card.className = "game"; card.tabIndex = 0;
  card.setAttribute("aria-label", "Play " + game.name);

  const cover = document.createElement("div"); cover.className = "cover";
  if (game.cover) {
    const img = document.createElement("img");
    img.src = game.cover; img.alt = game.name + " cover"; img.loading = "lazy";
    img.onerror = () => { img.remove(); cover.textContent = initialsOf(game.name); cover.style.background = tileBg(game.name); cover.style.fontWeight = "800"; cover.style.fontSize = "38px"; watchCover(cover, game); };
    cover.appendChild(img);
  } else { cover.textContent = initialsOf(game.name); cover.style.background = tileBg(game.name); cover.style.fontWeight = "800"; cover.style.fontSize = "38px"; cover.style.textShadow = "0 2px 6px rgba(0,0,0,.5)"; watchCover(cover, game); }

  const info = document.createElement("div"); info.className = "ginfo";
  const title = document.createElement("div"); title.className = "gtitle"; title.textContent = game.name;
  const play = document.createElement("button"); play.className = "playbtn"; play.textContent = "▶ Play";
  play.addEventListener("click", e => { e.stopPropagation(); playGame(game); });
  info.append(title, play);
  card.append(cover, info);
  card.addEventListener("click", () => playGame(game));
  card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); playGame(game); } });
  return card;
}

function renderGames() {
  const q = $("search").value.trim().toLowerCase();
  const sort = $("sort").value;
  let games = allGames().filter(g => g.name.toLowerCase().includes(q));
  games.sort(cmp);
  if (sort === "za") games.reverse();

  $("count").textContent = games.length + (games.length === 1 ? " game" : " games");
  const root = $("gameGrid"); root.replaceChildren();
  const bar = $("azbar"); bar.replaceChildren();

  if (!games.length) {
    const e = document.createElement("div"); e.className = "empty";
    e.textContent = ugsGames.length ? "No games match that search. Try another name." : "No games loaded yet. Press Refresh to try again.";
    root.appendChild(e); return;
  }

  const letters = [...new Set(games.map(g => letterOf(g.name)))];
  const all = ["#", ..."ABCDEFGHIJKLMNOPQRSTUVWXYZ"];
  all.forEach(l => {
    const b = document.createElement("button");
    b.textContent = l;
    if (letters.includes(l)) b.onclick = () => { const t = document.getElementById("sec-" + l); if (t) t.scrollIntoView({ behavior: "smooth" }); };
    else b.className = "off";
    bar.appendChild(b);
  });

  const useHeads = sort === "az";
  let grid = null, cur = null;
  const frag = document.createDocumentFragment();
  for (const g of games) {
    const l = letterOf(g.name);
    if (!grid || (useHeads && l !== cur)) {
      cur = l;
      if (useHeads) { const h = document.createElement("div"); h.className = "letter"; h.id = "sec-" + l; h.textContent = l; frag.appendChild(h); }
      grid = document.createElement("div"); grid.className = "grid"; frag.appendChild(grid);
    }
    grid.appendChild(makeCard(g));
  }
  root.appendChild(frag);
}

function playGame(game) {
  if (!game.url || !isHttpUrl(game.url)) { setStatus("This game does not have a valid playable URL.", "error"); return; }
  // UGS files are served as plain text by the CDN, so fetch the file and write it into a blank tab to run it.
  const w = window.open("about:blank", "_blank");
  if (!w) { setStatus("Your browser blocked the new tab. Allow pop-ups for this site and try again.", "error"); return; }
  w.document.write("<title>" + game.name.replace(/</g, "&lt;") + "</title><body style='background:#100c0b;color:#ffbd69;font-family:Arial;display:flex;align-items:center;justify-content:center;height:100vh;margin:0'>🎃 Loading " + game.name.replace(/</g, "&lt;") + "…</body>");
  fetch(game.url + "?t=" + Date.now())
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(text => { w.document.open(); w.document.write(text); w.document.close(); })
    .catch(err => {
      w.document.body.textContent = "Couldn't load this game (" + err.message + "). Close this tab and try again.";
    });
}

$("search").addEventListener("input", renderGames);
$("sort").addEventListener("change", renderGames);

loadGames();
</script>
</body>
</html>
