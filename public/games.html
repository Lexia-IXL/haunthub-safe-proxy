<title>Games • HauntHub 🎃</title>
<style>
:root{--bg:#100c0b;--panel:#1c1412;--orange:#ff7a18;--gold:#ffbd69;--text:#fff4e9;--muted:#b9a69b;--border:#493026}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#35190e 0%,var(--bg) 52%);color:var(--text);font-family:Arial,Helvetica,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#120d0df2;border-bottom:1px solid var(--border);backdrop-filter:blur(12px)}
.nav{max-width:1400px;margin:auto;padding:15px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}.brand{font-size:25px;font-weight:900;color:var(--orange);white-space:nowrap}.brand span{color:#fff}
button,.navlink{font:inherit;cursor:pointer;border:1px solid var(--border);background:#241814;color:var(--text);border-radius:10px;padding:10px 14px}button:hover,.navlink:hover{border-color:var(--orange);color:var(--gold)}
main{max-width:1400px;margin:auto;padding:24px 22px 70px}.hero{padding:25px 28px;border:1px solid #65371f;border-radius:20px;background:linear-gradient(120deg,#3b1b0d,#21120f 65%,#31170c);margin-bottom:22px}
h1{font-size:clamp(28px,4vw,44px);margin:8px 0}.eyebrow{color:var(--gold);font-size:12px;letter-spacing:2px;text-transform:uppercase;font-weight:bold}.hero p{color:#d9b9a4;line-height:1.6}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}input,select{background:#1a1210;color:var(--text);border:1px solid var(--border);border-radius:10px;padding:12px;font:inherit;min-width:0}#search{flex:1;min-width:200px}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}.letters button{padding:6px 10px;border-radius:8px}.letters button.active{background:var(--orange);color:#190d07}
.status{margin:12px 0;color:var(--gold);font-size:14px}.section{margin-top:24px}.section h2{font-size:21px;border-bottom:1px solid var(--border);padding-bottom:9px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
.game{background:var(--panel);border:1px solid var(--border);border-radius:13px;overflow:hidden;cursor:pointer;min-width:0;transition:transform .15s,border-color .15s}.game:hover{transform:translateY(-3px);border-color:var(--orange)}
.cover{aspect-ratio:4/3;background:#201410;overflow:hidden;display:flex;align-items:center;justify-content:center}.cover img{width:100%;height:100%;object-fit:cover;display:block}.title{padding:10px 10px 12px;font-weight:bold;font-size:13px;line-height:1.35;overflow-wrap:anywhere;min-height:52px}.sub{font-size:11px;color:var(--muted);font-weight:normal;margin-top:5px}
footer{text-align:center;padding:25px;color:#816e62;font-size:13px}
@media(max-width:600px){.nav{padding:12px}main{padding:15px 12px 45px}.hero{padding:20px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>

const $=id=>document.getElementById(id);
function cleanName(id){
 let n=id.replace(/^cl/i,'').replace(/\.html?$/i,'');
 n=n.replace(/([a-z])([A-Z])/g,'$1 $2').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
 const acronyms={fnaf:'FNAF',fnf:'FNF',gta:'GTA',nba:'NBA',nes:'NES',sms:'SMS',doom:'DOOM','2d':'2D','3d':'3D',io:'IO',vr:'VR',rpg:'RPG',fps:'FPS'};
 n=n.split(' ').map(word=>acronyms[word.toLowerCase()]||(/^\d+$/.test(word)?word:(word.length<=3?word.toUpperCase():word[0].toUpperCase()+word.slice(1).toLowerCase()))).join(' ');
 return n;
}
function keyName(s){return s.toLowerCase().replace(/^cl/,'').replace(/[^a-z0-9]/g,'')}
function fallbackCover(name,id){
 const safe=(name||'Game').replace(/[&<>"]/g,'');
 const hue=[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%28;
 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#${hue<14?'55240f':'2d1a17'}"/><stop offset="1" stop-color="#100c0b"/></linearGradient></defs><rect width="400" height="300" fill="url(#g)"/><circle cx="330" cy="50" r="75" fill="#ff7a18" opacity=".12"/><text x="200" y="115" fill="#ffbd69" font-size="62" text-anchor="middle">🎮</text><text x="200" y="180" fill="#fff4e9" font-family="Arial" font-size="23" font-weight="bold" text-anchor="middle">${safe.slice(0,28)}</text><text x="200" y="220" fill="#b9a69b" font-family="Arial" font-size="13" text-anchor="middle">HAUNTHUB ARCADE</text></svg>`;
 return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

function renderLetters(){
 const letters=['All',...'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ'];
 $('letters').replaceChildren();
 letters.forEach(letter=>{const b=document.createElement('button');b.textContent=letter;b.className=(activeLetter===letter||(activeLetter===''&&letter==='All'))?'active':'';b.onclick=()=>{activeLetter=letter==='All'?'':letter;render()};$('letters').append(b)});
}
function coverLookup(){
 // GN-Math has real cover art for overlapping IDs; only use a cover when the filename maps plausibly.
 const bases=['https://cdn.jsdelivr.net/gh/gn-math/covers@main/','https://cdn.jsdelivr.net/gh/freebuisness/covers@main/'];
 return bases;
}
function render(){
 const query=$('search').value.trim().toLowerCase(), sort=$('sort').value;
 let list=games.filter(g=>g.name.toLowerCase().includes(query)||g.id.toLowerCase().includes(query));
 if(activeLetter)list=list.filter(g=>g.name.toUpperCase().startsWith(activeLetter));
 list.sort((a,b)=>sort==='az'?a.name.localeCompare(b.name):b.name.localeCompare(a.name));
 $('count').textContent=list.length.toLocaleString()+' games listed';
 $('results').replaceChildren();
 if(!list.length){$('results').textContent='No games match your search.';return}
 const groups=new Map();
 list.forEach(g=>{const letter=/^[0-9]/.test(g.name)?g.name[0]:g.name[0].toUpperCase();if(!groups.has(letter))groups.set(letter,[]);groups.get(letter).push(g)});
 for(const [letter,items] of groups){
  const section=document.createElement('section');section.className='section';
  const h=document.createElement('h2');h.textContent=letter;section.append(h);
  const grid=document.createElement('div');grid.className='grid';
  items.forEach(g=>{
   const card=document.createElement('article');card.className='game';card.tabIndex=0;
   const c=document.createElement('div');c.className='cover';const img=document.createElement('img');img.alt=g.name+' cover';img.loading='lazy';img.src=fallbackCover(g.name,g.id);
   // Try a title-based real-cover candidate from the public GN-Math cover repository; fallback remains if it doesn't exist.
   const candidates=coverLookup().map(base=>base+encodeURIComponent(g.id.replace(/^cl/i,'').toLowerCase())+'.png');
   let candidate=0;function tryCandidate(){if(candidate>=candidates.length)return;img.src=candidates[candidate++];}
   img.onerror=()=>{if(candidate<candidates.length)tryCandidate();else{img.onerror=null;img.src=fallbackCover(g.name,g.id)}};
   tryCandidate();c.append(img);
   const t=document.createElement('div');t.className='title';t.textContent=g.name;
   const sub=document.createElement('div');sub.className='sub';sub.textContent='▶ Click to play';t.append(sub);
   card.append(c,t);card.onclick=()=>launch(g);card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();launch(g)}};
   grid.append(card);
  });
  section.append(grid);$('results').append(section);
 }
 $('status').textContent='Catalog ready. Some older files or covers may be missing.';
}
function launch(g){
 const url='https://cdn.skypack.dev/ugs-singlefiles@1.0.5/UGS-Files/'+encodeURIComponent(g.id+'.html');
 const win=window.open('about:blank','_blank');
 if(!win){$('status').textContent='Pop-up blocked. Allow pop-ups for HauntHub and click the game again.';return}
 win.document.open();win.document.write('<!doctype html><html><head><meta charset="utf-8"><title>'+g.name.replace(/[&<>]/g,'')+'</title><meta name="viewport" content="width=device-width,initial-scale=1"></head><body style="margin:0;background:#000"><iframe src="'+url.replace(/&/g,'&amp;').replace(/"/g,'&quot;')+'" style="border:0;width:100vw;height:100vh" allow="autoplay;fullscreen;gamepad" allowfullscreen></iframe></body></html>');win.document.close();
}
